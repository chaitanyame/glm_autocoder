# =============================================================================
# ZLM Code Harness - Development Docker Compose
# =============================================================================
# Usage:
#   docker-compose -f docker-compose.dev.yml up
#
# Features:
#   - Hot reload for Python code
#   - Volume mounts for live development
#   - Vite dev server proxy
# =============================================================================

services:
  zlm-harness-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: zlm-code-harness:dev
    container_name: zlm-code-harness-dev
    
    ports:
      - "8888:8888"   # FastAPI backend
      - "5173:5173"   # Vite dev server
    
    environment:
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PYTHONUNBUFFERED=1
    
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Don't mount these (use container's versions)
      - /app/venv
      - /app/ui/node_modules
      - /app/ui/dist
      # Mount projects directory
      - ${PROJECTS_DIR:-~/Projects}:/projects
      # Persist registry
      - zlm-data-dev:/root/.zlm-harness
    
    # Override default command to run in dev mode
    command: ["python", "start_ui.py", "--dev"]
    
    stdin_open: true
    tty: true

volumes:
  zlm-data-dev:
    driver: local
